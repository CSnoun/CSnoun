<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Nicholas — games in the making</title>
  <desc id="desc">A midnight blue banner with icy blue light, gold accents, and stars.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop offset="0" stop-color="#08142c"/>
      <stop offset=".55" stop-color="#112c68"/>
      <stop offset="1" stop-color="#071228"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6cbcff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#6cbcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b5"/>
      <stop offset="1" stop-color="#cbaa54"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b8d6ff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#night)"/>
